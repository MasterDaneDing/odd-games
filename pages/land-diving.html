<h1>Land Diving</h1>
<div class="meta"><div class="flag"><svg viewBox="0 0 90 60" aria-label="Flag of Vanuatu"><rect width="90" height="30" fill="#d21034"/><rect y="30" width="90" height="30" fill="#009543"/><path d="M0 0 L42 30 L0 60 Z" fill="#000"/><path d="M0 4 L36 30 L0 56 Z" fill="#fdce12"/><path d="M0 8 L30 30 L0 52 Z" fill="#000"/><circle cx="14" cy="30" r="5" fill="none" stroke="#fdce12" stroke-width="2"/></svg></div><div class="place">From: Vanuatu</div></div>
<p class="copy">Land diving comes from Pentecost Island, in Vanuatu. Men jump from a tall wooden tower. Vines tied to their ankles are meant to stop them just above the ground. It is a harvest ritual, not a game for visitors.</p>
